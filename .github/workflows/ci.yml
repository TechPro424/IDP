# GitHub Actions CI pipeline for Slop Filter
name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm test

      # Plan §12 asks for a dependency audit in CI. Advisory, not gating: a new
      # CVE upstream must not turn an unrelated PR red.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Build extension
        run: pnpm -C packages/extension build

      - run: pnpm exec playwright install chromium --with-deps

      # Content-script tests that need no extension host (run everywhere) and
      # the extension-loading suite (needs the full Chromium, which a runner has).
      - name: Run content-script tests
        run: pnpm -C packages/extension exec playwright test
        env:
          SLOP_E2E_FULL: '1'

      # Browser-vs-Node feature parity (plan §7.1); bundles the library with Vite
      # and compares against the Node CLI on the same WAV bytes.
      - name: Run browser parity tests
        run: pnpm exec playwright test --config packages/features/playwright.config.ts

      - name: Install Python dependencies
        run: pip install -r packages/scripts/requirements.txt

      # The data scripts refuse to run without a real dataset. That refusal is
      # the guarantee behind §14.5 (never invent measurements), so CI asserts it
      # rather than working around it.
      - name: Assert metrics scripts fail closed
        run: |
          set +e
          bash packages/scripts/evaluate.sh -j && { echo "evaluate.sh emitted metrics without data"; exit 1; }
          bash packages/scripts/compute-thresholds.sh && { echo "compute-thresholds.sh emitted thresholds without data"; exit 1; }
          python3 packages/scripts/train-model.py && { echo "train-model.py trained without data"; exit 1; }
          echo "all metrics scripts refused to run without data — correct"

      - name: Data pipeline (train, thresholds, evaluation)
        if: hashFiles('packages/data/processed/train.csv') != ''
        run: |
          bash packages/scripts/assemble-dataset.sh
          bash packages/scripts/augment-dataset.sh -c
          python3 packages/scripts/train-model.py
          bash packages/scripts/export-models.sh
          bash packages/scripts/compute-thresholds.sh
          bash packages/scripts/evaluate.sh -j

      - name: Upload evaluation report
        if: hashFiles('results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: results/**

      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: packages/extension/dist/**

  edge-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - run: pnpm config set ignore-workspace-root-check true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Edge worker tests
        run: pnpm -C packages/edge test