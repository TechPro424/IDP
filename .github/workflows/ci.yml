# GitHub Actions CI pipeline for Slop Filter
# Triggers on pushes and pull requests to main and feature branches
name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript type‑check
        run: pnpm exec tsc --noEmit
        
      - run: pnpm exec playwright install chromium --with-deps

      - name: Run unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm -C packages/extension build

      - name: Run e2e tests with Playwright
        run: pnpm -C packages/extension test:e2e
        env:
          # Provide a dummy endpoint for the edge worker during e2e
          BASE_URL: http://localhost:8787

      - name: Run dataset assembly script
        run: bash packages/scripts/assemble-dataset.sh

      - name: Run augmentation script
        run: bash packages/scripts/augment-dataset.sh -c

      - name: Install Python dependencies for training
        run: pip install -r requirements.txt

      - name: Train baseline model
        run: python packages/scripts/train-model.py

      - name: Export model weights
        run: bash packages/scripts/export-models.sh

      - name: Compute thresholds
        run: bash packages/scripts/compute-thresholds.sh

      - name: Run evaluation placeholder
        run: bash packages/scripts/evaluate.sh -j

      - name: Upload evaluation report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: results/**

      - name: Upload extension build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: packages/extension/dist/**

  # Optional: test Edge worker locally via wrangler dev
  edge-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Cloudflare Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run Edge worker tests
        run: pnpm -C packages/edge test

# End of workflow
