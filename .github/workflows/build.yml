name: Build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - run: pnpm install
      - run: pnpm test
      - run: pnpm test:e2e
+      # Package Chrome and Firefox extensions
+      - name: Build Chrome package
+        run: pnpm run package:chrome
+      - name: Build Firefox package
+        run: pnpm run package:firefox
