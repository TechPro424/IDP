<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Slop Filter Options</title>
  <style>
    body{font-family:Arial,sans-serif;margin:20px;}
    label{display:block;margin-top:10px;}
    textarea{width:100%;height:80px;}
    button{margin-top:10px;}
  </style>
</head>
<body>
  <h1>Slop Filter Settings</h1>
  <label>Slop Threshold (0–1):
    <input type="number" id="threshold" min="0" max="1" step="0.01" value="0.5" />
  </label>
  <label>Allowlist (comma‑separated URLs):
    <textarea id="allowlist"></textarea>
  </label>
  <label>Denylist (comma‑separated URLs):
    <textarea id="denylist"></textarea>
  </label>
  <label><input type="checkbox" id="annotation" /> Enable Annotation Mode</label>
  <button id="saveBtn">Save Settings</button>
  <button id="deleteBtn">Delete All Stored Data</button>
<button id="exportBtn">Export Annotations</button>
  <script src="options.js"></script>
</body>
</html>
